<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nexGJB · 行政区划提取器</title><link rel="stylesheet" href="/static/leaflet/leaflet.css">
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#18232d;--muted:#71808d;--line:#e5eaee;--green:#167d70;--green2:#e8f4f1;--shadow:0 8px 28px rgba(24,42,54,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:13px}.logo{width:34px;height:34px;border-radius:10px;background:#e5f2ef;color:var(--green);display:grid;place-items:center;font-size:19px}.brand{font-weight:700;font-size:16px}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}.top-right{margin-left:auto;color:var(--muted);font-size:12px}
.workspace{width:min(1500px,100%);margin:auto;padding:22px 24px 28px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;flex:1}.sidebar,.map-card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.sidebar{padding:20px;display:flex;flex-direction:column;gap:19px}.heading h1{font-size:19px;margin:0 0 4px}.heading p{margin:0;color:var(--muted);font-size:12px}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;background:#f2f5f6;border-radius:11px;padding:4px;gap:4px}.mode-btn{border:0;background:transparent;border-radius:8px;padding:10px 7px;color:#63717b;font-weight:600}.mode-btn.active{background:#fff;color:var(--green);box-shadow:0 1px 5px #14283219}.mode-btn span{display:block;font-size:10px;font-weight:400;color:#8b969e;margin-top:2px}
.section{border-top:1px solid var(--line);padding-top:16px}.section-title{font-weight:650;margin-bottom:11px}.step{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:7px;background:#edf4f3;color:var(--green);font-size:11px;margin-right:7px}.levels,.sublevel{display:flex;gap:7px}.levels button,.sublevel button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;color:#53616c;font-weight:600}.levels button.active,.sublevel button.active{border-color:#72b6a9;background:var(--green2);color:var(--green)}.hint{font-size:11px;color:var(--muted);margin-top:9px}
.selection-box{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfc;min-height:76px;max-height:200px;overflow:auto;margin-top:10px}.empty{color:#98a3aa;font-size:12px;padding:7px 2px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #cfe4df;background:#edf7f4;color:#286f65;border-radius:20px;padding:5px 9px;font-size:11px;display:flex;align-items:center;gap:6px}.chip button{border:0;background:none;color:#5c8f86;padding:0;font-size:14px}.action-row{display:flex;gap:8px;margin-top:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:#53616c;font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:disabled{opacity:.42;cursor:not-allowed}.btn.full{width:100%;padding:11px}
.coord-list{display:grid;gap:7px}.coord-option{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer}.coord-option.selected{border-color:#72b6a9;background:#f4faf8}.coord-option input{accent-color:var(--green);margin:0}.coord-option b{font-size:12px}.coord-option small{margin-left:auto;color:var(--muted);font-size:10px}
.map-card{position:relative;overflow:hidden;min-height:650px;display:flex;flex-direction:column}.map-toolbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:10px}.map-title{font-weight:650}.map-tools{margin-left:auto;display:flex;gap:6px}.icon-btn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#697782}.map-canvas{position:relative;flex:1;min-height:560px;overflow:hidden;background:#f2f5f4}#realmap{position:absolute;inset:0;z-index:0;background:#f2f5f4}.map-hint{position:absolute;top:16px;left:18px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--green);font-size:11px;z-index:500;pointer-events:none}.map-footer{height:47px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 17px;color:var(--muted);font-size:11px;gap:16px}.map-footer span:last-child{margin-left:auto}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#203b3a;color:#fff;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:1100}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#101d2452;display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.overlay.show{display:flex}.modal{width:min(440px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px #10232b33}.modal h2{margin:0 0 5px;font-size:18px}.modal p{color:var(--muted);font-size:12px}.modal-summary{background:#f5f8f7;border-radius:10px;padding:12px;margin:14px 0;font-size:12px;line-height:1.9;max-height:45vh;overflow:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}
@media(max-width:850px){.workspace{grid-template-columns:1fr;padding:12px}.map-card{min-height:500px}.map-canvas{min-height:420px}.topbar{padding:0 15px}}
.region-label{background:transparent;border:0;box-shadow:none;color:#294d45;font-size:11px;font-weight:600;white-space:nowrap;text-shadow:0 0 3px white,0 0 3px white;pointer-events:none}.region-label:before{display:none}#scopeBtn[aria-pressed=true]{background:#e8f4f1;color:#167d70;border-color:#72b6a9}.selection-box{border:0;background:transparent;padding:0;min-height:0;max-height:180px;margin-top:0}.empty{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;color:#71808d;text-align:center}.chips{display:flex;flex-direction:column;gap:0}.chip{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 2px;font-size:13px;color:var(--ink)}.chip button{margin-left:auto;padding:4px 8px;color:var(--muted)}.chip-mark{color:var(--green);font-size:13px}.selection-count{float:right;font-size:12px;font-weight:400;color:var(--muted)}.action-row{justify-content:flex-end;margin-top:4px}.clear-link{border:0;padding:5px 0;background:transparent;color:var(--muted);font-size:12px}.coord-option:has(input:disabled){opacity:.5;cursor:default}.coord-option.selected{opacity:1}.modal{max-height:90vh;overflow:auto}#format{font:inherit;color:var(--ink);background:#fff}.sidebar{gap:14px}.section{padding-top:12px}</style></head>
<body><div class="app">
<header class="topbar"><div class="logo">⌖</div><div class="brand">nexGJB<small>Next Generation GeoJSON Boundary</small></div><div class="top-right">内网工具</div></header>
<main class="workspace"><aside class="sidebar">
<div class="heading"><h1>提取行政区划</h1><p>选择区域，设置范围，下载边界数据</p></div>
<div class="mode-switch"><button class="mode-btn active" data-mode="point">点选模式<span>自由多选</span></button><button class="mode-btn" data-mode="area">大区域模式<span>向下提取</span></button></div>
<section class="section"><div class="section-title"><i class="step">1</i><span id="levelTitle">选择行政区层级</span></div><div class="levels"><button class="level-btn" data-level="province">省级</button><button class="level-btn active" data-level="city">市级</button><button class="level-btn" data-level="county">县级</button></div><div class="hint" id="levelHint">地图仅显示当前层级</div></section>
<section class="section"><div class="section-title"><i class="step">2</i><span id="selectTitle">已选行政区</span><span id="selectionCount" class="selection-count">0 个</span></div><div class="selection-box" aria-live="polite"><div class="empty" id="emptyText"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 3l7 18 2-8 8-2L4 3z"/><path d="M15 3v4M21 4l-3 3"/></svg><span id="mapInstruction">请在地图中点击选择</span></div><div class="chips" id="chips"></div></div><div class="action-row"><button class="btn clear-link" id="clearBtn">清空选择</button></div></section>
<section class="section hidden" id="targetSection"><div class="section-title"><i class="step">3</i>选择提取到的层级</div><div class="sublevel" id="targetOptions"></div><div class="hint" id="targetHint"></div></section>
<section class="section"><div class="section-title"><i class="step" id="crsStep">3</i>输出坐标系</div><div class="coord-list"><label class="coord-option selected"><input type="radio" name="crs" value="WGS84" checked><b>WGS 84</b><small>EPSG:4326</small></label><label class="coord-option"><input type="radio" name="crs" value="CGCS2000"><b>CGCS2000</b><small>EPSG:4490</small></label><label class="coord-option"><input type="radio" name="crs" value="L-EST97"><b>L-EST97</b><small>EPSG:3301</small></label></div></section>
<section class="section"><div class="section-title"><i class="step" id="formatStep">4</i><label for="format">输出格式</label></div><select id="format" style="width:100%;padding:9px;margin:7px 0;border:1px solid #e5eaee;border-radius:8px"><option value="geojson">GeoJSON (.geojson)</option><option value="gpkg">GeoPackage (.gpkg)</option><option value="shp">Shapefile (.zip)</option><option value="kml">KML (.kml)</option><option value="parquet">GeoParquet (.parquet)</option><option value="csv">CSV + WKT (.csv)</option><option value="fgb">FlatGeobuf (.fgb)</option></select><div class="hint" id="formatNote"></div></section><div style="margin-top:auto"><button class="btn primary full" id="downloadBtn" disabled>下载文件</button><div class="hint" id="downloadHint" style="text-align:center" aria-live="polite">请在地图中选择行政区</div></div></aside>
<section class="map-card"><div class="map-toolbar"><div class="map-title">行政区划地图</div><div class="map-tools"><button id="scopeBtn" class="btn" aria-pressed="false">只看黑龙江</button><button id="zoomIn" class="icon-btn" title="放大">＋</button><button id="zoomOut" class="icon-btn" title="缩小">－</button><button id="resetView" class="icon-btn" title="重置视图">⌂</button></div></div><div class="map-canvas"><div class="map-hint" id="mapHint"></div><div id="realmap"></div></div><div class="map-footer"><span>地图区域</span><span>点击后高亮显示</span><span id="mapCount">已选择 0 个区域</span></div></section></main></div>
<div class="overlay" id="confirmOverlay"><div class="modal"><h2>确认导出</h2><p>请检查提取范围、坐标系和文件格式。</p><div class="modal-summary" id="modalSummary"></div><div class="modal-actions"><button class="btn" id="backBtn">返回修改</button><button class="btn primary" id="confirmDownload">确认下载</button></div></div></div><div class="toast" id="toast"></div>
<script src="/static/leaflet/leaflet.js"></script><script src="/static/app.js?v=1.3"></script></body></html>
